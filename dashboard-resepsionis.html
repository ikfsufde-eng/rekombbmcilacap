<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Resepsionis</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<div id="arm">
  <h2>🟩 Dashboard Resepsionis</h2>
  <p>Masukkan PIN dan nama. Tombol di bawah juga mengaktifkan suara alarm (syarat browser). Biarkan layar ini terbuka.</p>
  <input id="pin" type="password" placeholder="PIN Dashboard Resepsionis" autocomplete="off">
  <input id="nama" type="text" placeholder="Nama Anda" maxlength="40">
  <div id="err"></div>
  <button id="btnArm" class="green">MASUK &amp; AKTIFKAN ALARM</button>
</div>
<header>
  <div><span class="role">PERAN: RESEPSIONIS</span><h1>Dashboard Resepsionis<small>Alarm berbunyi saat ada pemohon baru menunggu</small></h1></div>
  <label class="sw" id="swWrap"><input type="checkbox" id="swLayanan"><span class="track"></span><span id="swText">LIVE MEET OFFLINE</span></label>
  <span id="conn" class="pill off">● Menghubungkan…</span>
</header>
<main>
  <div class="legend"><span>🟦 Pemohon (warga)</span><span>🟩 Resepsionis</span><span>🟧 Petugas teknis</span></div>
  <div id="list"></div>
  <div id="hist" class="hist"></div>
</main>
<footer><button id="btnTest" class="ghost">Tes Alarm</button></footer>
<script>
window.DASH = {
  role: 'RESEPSIONIS',
  title: 'Dashboard Resepsionis',
  pin: '111111',            // GANTI PIN INI
  canSwitch: false,
  ringOn: ['MENUNGGU'],
  ringText: '🔔 PEMOHON BARU MENUNGGU!',
  actions: (s, h) => {
    if (s.status === 'MENUNGGU' || s.status === 'DITERIMA' || s.status === 'DIESKALASI') {
      h.add('📹 Masuk Meet', 'green', () => { h.open(); h.update(Object.assign(s.status === 'MENUNGGU' ? { status: 'DITERIMA' } : {}, { resepsionis: h.nama })); });
    }
    if (s.status === 'MENUNGGU' || s.status === 'DITERIMA') h.add('🆘 Tidak teratasi — Panggil Petugas', 'amber', () => h.update({ status: 'DIESKALASI', resepsionis: h.nama }));
    if (s.status === 'DIESKALASI') h.add('Menunggu petugas teknis…', 'ghost', () => {});
    h.add('✅ Selesai', 'ghost', () => h.update({ status: 'SELESAI' }));
  }
};
</script>
<script src="dashboard.js"></script>
</body>
</html>
